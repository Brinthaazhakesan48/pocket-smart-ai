{% extends 'base.html' %}{% block content %}<div class="card form"><h1>Jewelry Budget Planner</h1><form id="f" enctype="multipart/form-data"><div class="field"><label>Budget (₹)</label><input name="budget" type="number" min="1" required></div><div class="row"><div class="field"><label>Occasion</label><input name="occasion" placeholder="Wedding" required></div><div class="field"><label>Style</label><select name="style"><option>elegant</option><option>traditional</option><option>minimal</option><option>statement</option></select></div></div><div class="row"><div class="field"><label>Outfit color</label><input name="outfit_color" placeholder="Optional"></div><div class="field"><label>Material</label><input name="material" value="any"></div></div><div class="field"><label>Optional outfit image</label><input name="image" type="file" accept="image/png,image/jpeg,image/webp"></div><button class="btn">Generate recommendations</button></form></div><div id="out" class="result"></div><script>f.onsubmit=async e=>{e.preventDefault();try{renderResult(await api('/generate-jewelry',{method:'POST',body:new FormData(f)}),out)}catch(err){out.innerHTML='<p class="danger">'+err.message+'</p>'}}</script>{% endblock %}
