{% extends 'base.html' %}{% block content %}<div class="card form"><h1>Home Interior Budget Planner</h1><form id="f"><div class="field"><label>Budget (₹)</label><input name="budget" type="number" min="1" required></div><div class="row"><div class="field"><label>Room</label><input name="room" placeholder="Living Room" required></div><div class="field"><label>Style</label><select name="style"><option>modern</option><option>minimal</option><option>traditional</option><option>industrial</option></select></div></div><div class="field"><label>Items (one per line: category,quantity)</label><textarea id="items" rows="5" placeholder="lighting,2\ndining,1\ndecor,3"></textarea></div><button class="btn">Generate plan</button></form></div><div id="out" class="result"></div><script>f.onsubmit=async e=>{e.preventDefault();try{const x={budget:+f.budget.value,room:f.room.value,style:f.style.value,items:document.getElementById('items').value.split('\n').filter(Boolean).map(s=>{const [category,quantity]=s.split(',');return {category:category.trim(),quantity:+quantity||1}})};renderResult(await api('/generate-home',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(x)}),out)}catch(err){out.innerHTML='<p class="danger">'+err.message+'</p>'}}</script>{% endblock %}
