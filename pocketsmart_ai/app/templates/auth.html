<div class="card form"><h1>{{ heading }}</h1><p class="muted">{{ subtitle }}</p><form id="authForm">{% if register %}<div class="field"><label>Name</label><input name="name" required minlength="2"></div>{% endif %}<div class="field"><label>Email</label><input type="email" name="email" required></div><div class="field"><label>Password</label><input type="password" name="password" required minlength="8"></div><button class="btn">{{ action }}</button><p id="msg"></p></form></div><script>document.getElementById('authForm').addEventListener('submit',async e=>{e.preventDefault();const fd=new FormData(e.target);const body=Object.fromEntries(fd);try{await api('{{ endpoint }}',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});location.href='/dashboard'}catch(err){document.getElementById('msg').textContent=err.message;document.getElementById('msg').className='danger'}})</script>
