{% extends 'base.html' %}{% block content %}<div class="card form"><h1>Party Budget Planner</h1><form id="f"><div class="row"><div class="field"><label>Budget (₹)</label><input name="budget" type="number" min="1" required></div><div class="field"><label>Guests</label><input name="guests" type="number" min="1" required></div></div><div class="row"><div class="field"><label>Event type</label><input name="event_type" placeholder="Birthday" required></div><div class="field"><label>Venue</label><input name="venue" placeholder="Indoor" value="indoor"></div></div><div class="row"><div class="field"><label>City</label><input name="city"></div><div class="field"><label>Food preference</label><input name="food_preference" value="mixed"></div></div><button class="btn">Generate plan</button></form></div><div id="out" class="result"></div><script>f.onsubmit=async e=>{e.preventDefault();try{const x=Object.fromEntries(new FormData(f));x.budget=+x.budget;x.guests=+x.guests;renderResult(await api('/generate-party',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(x)}),out)}catch(err){out.innerHTML='<p class="danger">'+err.message+'</p>'}}</script>{% endblock %}
