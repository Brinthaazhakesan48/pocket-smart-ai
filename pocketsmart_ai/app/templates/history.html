{% extends 'base.html' %}{% block content %}<h1>Recommendation History</h1><div id="out" class="grid"></div><script>requireAuth().then(async()=>{try{const x=await api('/history');out.innerHTML=x.length?x.map(r=>`<div class="card"><span class="pill">${r.planner}</span><h3>${r.response.summary}</h3><p>${new Date(r.created_at+'Z').toLocaleString()}</p><a class="btn secondary" href="/recommendations-details/${r.id}" onclick="event.preventDefault();alert('Open the API detail at /recommendations-details/${r.id}')">Details</a></div>`).join(''):'<div class="card">No saved recommendations yet.</div>'}catch(e){out.innerHTML='<p class="danger">'+e.message+'</p>'}})</script>{% endblock %}
