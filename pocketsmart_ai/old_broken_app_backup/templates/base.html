<!doctype html>

<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

```
<title>{{ title or "PocketSmart AI" }}</title>

<link rel="stylesheet" href="/static/style.css">
```

</head>

<body>

```
<nav class="nav">
    <a class="brand" href="/">PocketSmart AI</a>

    <div>
        <a href="/home-planner">Home</a>
        <a href="/party-planner">Party</a>
        <a href="/jewelry-planner">Jewelry</a>
        <a href="/history">History</a>

        {% if user %}
            <a href="/dashboard">Dashboard</a>
            <a href="#" id="logoutLink">Logout</a>
        {% else %}
            <a href="/login">Login</a>
            <a href="/register">Register</a>
        {% endif %}
    </div>
</nav>

<main class="container">
    {% block content %}{% endblock %}
</main>

<footer class="footer">
    PocketSmart AI • Budget-aware planning assistant
</footer>

<script src="/static/app.js"></script>

<script>
    const logoutLink = document.getElementById("logoutLink");

    if (logoutLink) {
        logoutLink.addEventListener("click", async (event) => {
            event.preventDefault();

            try {
                const response = await fetch("/logout", {
                    method: "POST",
                    credentials: "include"
                });

                if (!response.ok) {
                    throw new Error("Logout failed.");
                }

                window.location.href = "/";
            } catch (error) {
                console.error(error);
                alert("Could not log out. Please try again.");
            }
        });
    }
</script>
```

</body>
</html>
