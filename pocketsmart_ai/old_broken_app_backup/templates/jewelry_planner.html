</div>

<div id="out" class="result"></div>

<script>
const jewelryForm = document.getElementById("jewelryForm");
const out = document.getElementById("out");

jewelryForm.addEventListener("submit", async (event) => {
    event.preventDefault();

    try {
        const formData = new FormData(jewelryForm);

        const result = await api("/api/generate-jewelry", {
            method: "POST",
            body: formData
        });

        renderResult(result, out);

    } catch (error) {
        out.innerHTML = `
            <p class="danger">${error.message}</p>
        `;
    }
});
</script>
