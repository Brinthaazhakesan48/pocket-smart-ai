<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In - PocketSmart AI</title>
  <link rel="stylesheet" href="/static/styles.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body style="background-color: #f1f5f9;">

  <div class="auth-wrapper">
    <div class="auth-card">
      <div class="auth-header">
        <a href="/" style="text-decoration:none;"><div class="auth-logo"><i class="fa-solid fa-wallet"></i> PocketSmart</div></a>
        <div class="auth-subtitle">AI-Powered Budget Planning</div>
        <h2 class="auth-title">Welcome Back</h2>
      </div>

      <div id="error-alert" style="display:none; background:#fee2e2; border:1px solid #f87171; color:#b91c1c; padding:0.7rem; border-radius:6px; margin-bottom:1.2rem; font-size:0.88rem;"></div>

      <form id="login-form">
        <div class="form-group">
          <label class="form-label" for="username">Username</label>
          <div class="input-with-icon">
            <i class="fa-solid fa-user input-icon"></i>
            <input type="text" id="username" class="form-control" placeholder="Enter your username" required autofocus>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="password">Password</label>
          <div class="input-with-icon">
            <i class="fa-solid fa-lock input-icon"></i>
            <input type="password" id="password" class="form-control" placeholder="Enter your password" required>
          </div>
        </div>

        <div style="display: flex; justify-content: flex-end; margin-bottom: 1.5rem;">
          <a href="#" style="font-size: 0.82rem; color: #2563eb; text-decoration: none;">Forgot Password?</a>
        </div>

        <button type="submit" id="submit-btn" class="btn-primary">
          <span>Sign In</span> <i class="fa-solid fa-arrow-right"></i>
        </button>
      </form>

      <div class="auth-footer">
        Don't have an account? <a href="/register">Create Account</a>
      </div>
      
      <div style="margin-top: 1.5rem; text-align: center; font-size: 0.8rem; color: #94a3b8; border-top: 1px solid #f1f5f9; padding-top: 1rem;">
        Demo account: <strong>demo</strong> / <strong>password123</strong>
      </div>
    </div>
  </div>

  <script>
    const form = document.getElementById('login-form');
    const errorAlert = document.getElementById('error-alert');
    const submitBtn = document.getElementById('submit-btn');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorAlert.style.display = 'none';
      submitBtn.disabled = true;
      submitBtn.innerHTML = '<span class="spinner"></span> Signing In...';

      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;

      try {
        const formData = new URLSearchParams();
        formData.append('username', username);
        formData.append('password', password);

        const response = await fetch('/token', {
          method: 'POST',
          headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
          body: formData
        });

        const data = await response.json();

        if (response.ok && data.access_token) {
          // Store token in localStorage for client requests as backup
          localStorage.setItem('ps_token', data.access_token);
          window.location.href = '/dashboard';
        } else {
          errorAlert.textContent = data.detail || 'Invalid username or password. Please try again.';
          errorAlert.style.display = 'block';
          submitBtn.disabled = false;
          submitBtn.innerHTML = '<span>Sign In</span> <i class="fa-solid fa-arrow-right"></i>';
        }
      } catch (err) {
        errorAlert.textContent = 'Connection error. Please ensure backend server is running.';
        errorAlert.style.display = 'block';
        submitBtn.disabled = false;
        submitBtn.innerHTML = '<span>Sign In</span> <i class="fa-solid fa-arrow-right"></i>';
      }
    });
  </script>
</body>
</html>
