<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account - PocketSmart AI</title>
  <link rel="stylesheet" href="/static/styles.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body style="background-color: #f1f5f9;">

  <div class="auth-wrapper">
    <div class="auth-card">
      <div class="auth-header">
        <a href="/" style="text-decoration:none;"><div class="auth-logo"><i class="fa-solid fa-wallet"></i> PocketSmart</div></a>
        <div class="auth-subtitle">AI-Powered Budget Planning</div>
        <h2 class="auth-title">Create Your Account</h2>
      </div>

      <div id="error-alert" style="display:none; background:#fee2e2; border:1px solid #f87171; color:#b91c1c; padding:0.7rem; border-radius:6px; margin-bottom:1.2rem; font-size:0.88rem;"></div>

      <form id="register-form">
        <div class="form-group">
          <label class="form-label" for="username">Username</label>
          <div class="input-with-icon">
            <i class="fa-solid fa-user input-icon"></i>
            <input type="text" id="username" class="form-control" placeholder="Choose a username" required autofocus>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="email">Email</label>
          <div class="input-with-icon">
            <i class="fa-solid fa-envelope input-icon"></i>
            <input type="email" id="email" class="form-control" placeholder="Enter your email" required>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="password">Password</label>
          <div class="input-with-icon">
            <i class="fa-solid fa-lock input-icon"></i>
            <input type="password" id="password" class="form-control" placeholder="Create a strong password" required>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="confirm_password">Confirm Password</label>
          <div class="input-with-icon">
            <i class="fa-solid fa-circle-check input-icon"></i>
            <input type="password" id="confirm_password" class="form-control" placeholder="Confirm your password" required>
          </div>
        </div>

        <button type="submit" id="submit-btn" class="btn-primary" style="margin-top: 1.5rem;">
          <span>Create Account</span> <i class="fa-solid fa-user-plus"></i>
        </button>
      </form>

      <div class="auth-footer">
        Already have an account? <a href="/login">Sign In</a>
      </div>
    </div>
  </div>

  <script>
    const form = document.getElementById('register-form');
    const errorAlert = document.getElementById('error-alert');
    const submitBtn = document.getElementById('submit-btn');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorAlert.style.display = 'none';

      const username = document.getElementById('username').value.trim();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const confirmPassword = document.getElementById('confirm_password').value;

      if (password !== confirmPassword) {
        errorAlert.textContent = 'Passwords do not match. Please verify.';
        errorAlert.style.display = 'block';
        return;
      }

      submitBtn.disabled = true;
      submitBtn.innerHTML = '<span class="spinner"></span> Creating Account...';

      try {
        const response = await fetch('/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            username: username,
            email: email,
            password: password,
            full_name: username
          })
        });

        const data = await response.json();

        if (response.ok) {
          if (data.access_token) {
            localStorage.setItem('ps_token', data.access_token);
          }
          window.location.href = '/dashboard';
        } else {
          errorAlert.textContent = data.detail || 'Registration failed. Please check inputs.';
          errorAlert.style.display = 'block';
          submitBtn.disabled = false;
          submitBtn.innerHTML = '<span>Create Account</span> <i class="fa-solid fa-user-plus"></i>';
        }
      } catch (err) {
        errorAlert.textContent = 'Connection error. Please try again later.';
        errorAlert.style.display = 'block';
        submitBtn.disabled = false;
        submitBtn.innerHTML = '<span>Create Account</span> <i class="fa-solid fa-user-plus"></i>';
      }
    });
  </script>
</body>
</html>
